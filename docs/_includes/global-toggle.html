<div class="change-toggle global-toggle buttons">
  <button data-period="7d">1 Week</button>
  <button data-period="14d" class="active">2 Weeks</button>
  <button data-period="1mo">1 Month</button>
</div>

<div class="change-toggle global-toggle dropdown">
  <select id="period-select">
    <option value="7d">1 Week</option>
    <option value="14d" selected>2 Weeks</option>
    <option value="1mo">1 Month</option>
  </select>
</div>
