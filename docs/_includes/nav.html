{% assign latest_prediction_date = '2026-03-15' %}

<div id="nav">
  <div class="nav-inner">
    <nav class="simple-nav">
      <a class="league-route no-rewrite" data-page="home" href="/index.html">Home</a>
      <a class="today-scores-link no-rewrite" href="/men/index.html">Today's Scores</a>
      <a class="league-route no-rewrite" data-page="bracketology" href="/men/predict_{{ latest_prediction_date }}.html">Bracketology</a>
      <a class="league-route no-rewrite" data-page="conference" href="/men/conference.html">Conference Rankings</a>
    </nav>
  </div>
</div>

<nav class="bottom-nav">
  <a class="league-route no-rewrite" data-page="home" href="/index.html">
    <span class="icon">🏠</span>
    <span class="label">Home</span>
  </a>

  <a class="today-scores-link no-rewrite" href="/men/index.html">
    <span class="icon">🏀</span>
    <span class="label">Scores</span>
  </a>

  <a class="league-route no-rewrite" data-page="bracketology" href="/men/predict_{{ latest_prediction_date }}.html">
    <span class="icon">🧮</span>
    <span class="label">Bracketology</span>
  </a>

  <a class="league-route no-rewrite" data-page="conference" href="/men/conference.html">
    <span class="icon">🏆</span>
    <span class="label">Conferences</span>
  </a>
</nav>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const latestPredictionDate = "2026-03-15";

  function getLeague() {
    try {
      const stored = localStorage.getItem("league");
      if (stored === "men" || stored === "women") return stored;
    } catch (e) {}
    return window.location.pathname.startsWith("/women/") ? "women" : "men";
  }

  const routeBuilders = {
    home: () => `/index.html`,
    conference: league => `/${league}/conference.html`,
    bracketology: league => `/${league}/predict_${latestPredictionDate}.html`
  };

  document.querySelectorAll(".league-route").forEach(link => {
    link.addEventListener("click", function (e) {
      const page = this.dataset.page;
      if (!page || !routeBuilders[page]) return;

      e.preventDefault();
      const league = getLeague();
      window.location.href = routeBuilders[page](league);
    });
  });

  document.querySelectorAll(".today-scores-link").forEach(link => {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      const league = getLeague();
      window.location.href = `/${league}/index.html`;
    });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const path = window.location.pathname;

  let current = "home";

  if (path === "/" || path.includes("index.html") && !path.includes("/men/") && !path.includes("/women/")) {
    current = "home";
  }
  else if (path.includes("/men/") || path.includes("/women/")) {
    current = "scores";
  }
  if (path.includes("predict_")) {
    current = "bracketology";
  }
  if (path.includes("conference")) {
    current = "conference";
  }

  
  document.querySelectorAll(".bottom-nav a").forEach(link => {
    link.classList.remove("active");

    // special case for scores
    if (link.classList.contains("today-scores-link") && current === "scores") {
      link.classList.add("active");
    }

    if (link.dataset.page === current) {
      link.classList.add("active");
    }
  });

});
</script>
