<div class="countdown-top">
  <div class="countdown-label">Final Four Countdown</div>

  <div id="timer" class="timer-compact">
    <div class="time-pill">
      <span id="days">00</span>
      <div class="pill-label">D</div>
    </div>
    <div class="time-pill">
      <span id="hours">00</span>
      <div class="pill-label">H</div>
    </div>
    <div class="time-pill">
      <span id="minutes">00</span>
      <div class="pill-label">M</div>
    </div>
    <div class="time-pill">
      <span id="seconds">00</span>
      <div class="pill-label">S</div>
    </div>
  </div>
</div>

<script>
    const targetDate = new Date("April 4, 2026 18:00:00").getTime();

    const timerInterval = setInterval(function() {
        const now = new Date().getTime(); // Fixed syntax error: now = new Date().getTime()
        const distance = targetDate - now;

        const d = Math.floor(distance / (1000 * 60 * 60 * 24));
        const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);

        // Update individual elements
        document.getElementById("days").innerText = d;
        document.getElementById("hours").innerText = h;
        document.getElementById("minutes").innerText = m;
        document.getElementById("seconds").innerText = s;

        if (distance < 0) {
            clearInterval(timerInterval);
            document.getElementById("timer").innerHTML = "EXPIRED";
        }
    }, 1000);
</script>
