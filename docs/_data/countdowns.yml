# Countdown clocks, one entry per thing being counted down to.
#
# Rendered by _includes/countdown.html and driven by assets/js/countdown.js:
#
#     {% include countdown.html key="cbb" %}
#
# Adding a countdown is an edit here. Setting a date is an edit here too — the
# fantasy draft used to live in src/fantasy/config.py and the season tipoff in
# a hand-written include, so the same clock existed three times, in two
# languages, and the styling drifted between them.
#
# target  ISO 8601, no timezone: read as the reader's own local time, which is
#         what a countdown should do. The draft is 8pm wherever you are.
# expired what the card says once target passes. It is also the signal to stop
#         rendering the card at all on the next build — see the include.

cbb:
  eyebrow: 2026-2027 SEASON
  title: Monday, November 2
  target: "2026-11-02T00:00:00"
  expired: Tip-off. The season is here.

fantasy:
  eyebrow: 2026-2027 DRAFT
  title: Friday, August 21 - 8:00 PM
  target: "2026-08-21T20:00:00"
  expired: The draft is here. Good luck.

# Not placed on a page right now. It was _includes/countdown.html, which
# nothing included any more; kept because the date is the awkward part to
# look up again, and it is one line to place when March comes round.
selection_sunday:
  eyebrow: 2026 SELECTION SUNDAY
  title: Sunday, March 15 - 6:00 PM
  target: "2026-03-15T18:00:00"
  expired: The bracket is out.
