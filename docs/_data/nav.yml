# Navigation for gordstats.com, in two levels.
#
#   sections  the projects in this repo — one entry per section of the site
#   <section> the pages within that section, rendered as a sub-nav
#
# Adding a page is an edit here, not an edit to _includes/nav.html.
#
# `route` marks a link the CBB league toggle rewrites at click time (men vs
# women); see the script in _includes/nav.html. Links without one are literal.
# Bracketology has no url because it points at the most recent prediction,
# which is computed at build time from the pages that actually exist.

sections:
  - title: Home
    short: Home
    icon: "🏠"
    url: /

  - title: CBB
    short: CBB
    icon: "🏀"
    url: /cbb/
    section: cbb

  - title: CFB
    short: CFB
    icon: "🎓"
    url: /cfb/
    section: cfb

  - title: NFL
    short: NFL
    icon: "🏟️"
    url: /nfl/
    section: nfl

  - title: Fantasy
    short: Fantasy
    icon: "🏈"
    url: /fantasy/
    section: fantasy


# The Fantasy section holds three leagues. Its sub-nav opens with these as a
# switcher, then lists the pages of whichever league the page belongs to --
# `pages` names the list below that holds them. The league is resolved from
# the URL in _includes/nav.html: the college fantasy pages still live under
# /cfb/ and the WNBA dashboard under /wnba/, so no URL had to move.
fantasy_leagues:
  - title: NFL
    url: /fantasy/
    pages: fantasy

  - title: CFB
    url: /cfb/league/
    pages: cfb_fantasy

# WNBA is out of the switcher while its season is over. The `wnba:` page list
# below and everything under src/wnba are left alone - putting it back is
# uncommenting these three lines.
#  - title: WNBA
#    url: /wnba/
#    pages: wnba


cbb:
  # `phone: false` leaves a link off the sub-nav on a phone. Six CBB links
  # wrapped to a second row at 390px ("Power" alone on it); the section's own
  # chip in the row above already goes to its home.
  - title: Home
    short: Home
    icon: "🏠"
    url: /cbb/
    phone: false

  - title: Today's Scores
    short: Scores
    icon: "🏀"
    url: /men/
    route: today-scores

  - title: Bracketology
    short: Bracket
    icon: "🧮"
    route: bracketology

  - title: Conference Rankings
    short: Conf
    icon: "🏆"
    url: /men/conference
    route: conference

  - title: Prediction History
    short: History
    icon: "📜"
    url: /men/history
    route: history
    # Off the phone row for the Watch Guide; the CBB home links it.
    phone: false

  - title: Power Rankings
    short: Power
    icon: "⚡"
    url: /cbb/power/

  - title: Watch Guide
    short: Watch
    icon: "📺"
    url: /cbb/watch/


wnba:
  - title: Dashboard
    short: Dashboard
    icon: "📊"
    url: /wnba/


fantasy:
  # On a phone the NFL/CFB switcher shares one row with these five, so the
  # short labels are as short as they can be read: "Team", not "My Team", is
  # what lets the row fit a 360px screen (Sleeper's own tab says "Team").
  #
  # League Home holds the league's records (fantasy.site.records): the
  # archive a card each, and for a reader who has synced one, their own
  # league's history, drafts and waivers - so every page those cards open
  # belongs to this chip. Until 2026-09-29 they sat behind an Analytics chip
  # beside the power rankings; that chip is Power now.
  - title: League Home
    short: Home
    icon: "🏠"
    key: home
    url: /fantasy/
    covers: "/fantasy/history/ /fantasy/draft-review/ /fantasy/schedule/ /fantasy/transactions/ /fantasy/draft/ /fantasy/injuries/ /fantasy/waivers/ /fantasy/sync/ /profile/"

  - title: Matchups
    short: Matchups
    icon: "⚔️"
    key: matchups
    url: /fantasy/matchups/
    covers: "/fantasy/recap/"

  - title: My Team
    short: Team
    icon: "📋"
    key: myteam
    url: /fantasy/roster/

  - title: Power Rankings
    short: Power
    icon: "⚡"
    key: power
    url: /fantasy/power/

  - title: Usage
    short: Usage
    icon: "📦"
    key: usage
    url: /fantasy/usage/


cfb:
  # `group` draws a hairline between runs of related pages. The Yahoo college
  # fantasy league's pages moved to the Fantasy section (cfb_fantasy below);
  # what is left here is the real sport.
  - title: Home
    short: Home
    icon: "🏠"
    url: /cfb/
    group: home
    # Six links would wrap the phone row; the CFB chip above goes home.
    phone: false

  - title: Predictions
    short: Predict
    icon: "🔮"
    url: /cfb/predictions/
    group: model

  - title: Rankings
    short: Rankings
    icon: "📈"
    url: /cfb/power/
    # A team page is reached from the rankings; without this, /cfb/ (Home) was
    # the longest match for all 138 of them and lit up instead.
    covers: "/cfb/teams/"
    group: model

  - title: Team Stats
    short: Stats
    icon: "📊"
    url: /cfb/stats/
    group: model

  - title: Watch Guide
    short: Watch
    icon: "📺"
    url: /cfb/watch/
    group: reference

  - title: Schedule & Scores
    short: Schedule
    icon: "🏈"
    url: /cfb/schedule/
    group: reference


nfl:
  - title: Predictions
    short: Predict
    icon: "🔮"
    url: /nfl/

  - title: Watch Guide
    short: Watch
    icon: "📺"
    url: /nfl/watch/

  - title: Team Stats
    short: Stats
    icon: "📊"
    url: /nfl/stats/


# The Yahoo college fantasy league, shown under Fantasy > CFB.
cfb_fantasy:
  - title: League Home
    short: Home
    icon: "🏠"
    key: home
    url: /cfb/league/
    covers: "/cfb/live/"

  - title: Matchups
    short: Matchups
    icon: "⚔️"
    key: matchups
    url: /cfb/matchups/
    covers: "/cfb/recap/"

  - title: My Team
    short: Team
    icon: "📋"
    key: myteam
    url: /cfb/roster/

  - title: Power Rankings
    short: Power
    icon: "⚡"
    key: power
    url: /cfb/league/power/
    covers: "/cfb/strength/"

  - title: Usage
    short: Usage
    icon: "📦"
    key: usage
    url: /cfb/usage/

