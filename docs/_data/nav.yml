# Navigation for gordstats.com, in two levels.
#
#   sections  the projects in this repo — one entry per section of the site
#   <section> the pages within that section, rendered as a sub-nav
#
# Adding a page is an edit here, not an edit to _includes/nav.html.
#
# `route` marks a link the CBB league toggle rewrites at click time (men vs
# women); see the script in _includes/nav.html. Links without one are literal.
# Bracketology has no url because it points at the most recent prediction,
# which is computed at build time from the pages that actually exist.

sections:
  - title: Home
    short: Home
    icon: "🏠"
    url: /index.html

  - title: College Basketball
    short: CBB
    icon: "🏀"
    url: /cbb/index.html
    section: cbb

  - title: WNBA Fantasy
    short: WNBA
    icon: "📊"
    url: /wnba/index.html
    section: wnba

  - title: Fantasy Football
    short: Fantasy
    icon: "🏈"
    url: /fantasy/index.html
    section: fantasy


