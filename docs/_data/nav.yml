# Navigation for gordstats.com, in two levels.
#
#   sections  the projects in this repo — one entry per section of the site
#   <section> the pages within that section, rendered as a sub-nav
#
# Adding a page is an edit here, not an edit to _includes/nav.html.
#
# `route` marks a link the CBB league toggle rewrites at click time (men vs
# women); see the script in _includes/nav.html. Links without one are literal.
# Bracketology has no url because it points at the most recent prediction,
# which is computed at build time from the pages that actually exist.

sections:
  - title: Home
    short: Home
    icon: "🏠"
    url: /index.html

  - title: CBB
    short: CBB
    icon: "🏀"
    url: /cbb/index.html
    section: cbb

  - title: CFB
    short: CFB
    icon: "🎓"
    url: /cfb/index.html
    section: cfb

  - title: NFL
    short: NFL
    icon: "🏟️"
    url: /nfl/index.html
    section: nfl

  - title: Fantasy
    short: Fantasy
    icon: "🏈"
    url: /fantasy/index.html
    section: fantasy


# The Fantasy section holds three leagues. Its sub-nav opens with these as a
# switcher, then lists the pages of whichever league the page belongs to --
# `pages` names the list below that holds them. The league is resolved from
# the URL in _includes/nav.html: the college fantasy pages still live under
# /cfb/ and the WNBA dashboard under /wnba/, so no URL had to move.
fantasy_leagues:
  - title: NFL
    url: /fantasy/index.html
    pages: fantasy

  - title: CFB
    url: /cfb/league/
    pages: cfb_fantasy

# WNBA is out of the switcher while its season is over. The `wnba:` page list
# below and everything under src/wnba are left alone - putting it back is
# uncommenting these three lines.
#  - title: WNBA
#    url: /wnba/index.html
#    pages: wnba


cbb:
  - title: Home
    short: Home
    icon: "🏠"
    url: /cbb/index.html

  - title: Today's Scores
    short: Scores
    icon: "🏀"
    url: /men/index.html
    route: today-scores

  - title: Bracketology
    short: Bracket
    icon: "🧮"
    route: bracketology

  - title: Conference Rankings
    short: Conf
    icon: "🏆"
    url: /men/conference.html
    route: conference

  - title: Prediction History
    short: History
    icon: "📜"
    url: /men/history.html

  - title: Power Rankings
    short: Power
    icon: "⚡"
    url: /cbb/power/


wnba:
  - title: Dashboard
    short: Dashboard
    icon: "📊"
    url: /wnba/index.html


fantasy:
  # League Home holds this league's all-time metrics and, for a reader who
  # has synced one, their own league's history and drafts - so the two pages
  # those sections came from belong to this chip.
  - title: League Home
    short: Home
    icon: "🏠"
    key: home
    url: /fantasy/index.html
    covers: "/fantasy/history/ /fantasy/draft-review/"

  - title: Matchups
    short: Matchups
    icon: "⚔️"
    key: matchups
    url: /fantasy/matchups/

  - title: My Team
    short: My Team
    icon: "📋"
    key: myteam
    url: /fantasy/roster/

  - title: Usage
    short: Usage
    icon: "📦"
    key: usage
    url: /fantasy/usage/

  - title: Analytics
    short: Analytics
    icon: "📊"
    key: analytics
    url: /fantasy/analytics/
    covers: "/fantasy/power/ /fantasy/schedule/ /fantasy/draft/ /fantasy/transactions/ /fantasy/sync/ /profile/ /fantasy/waivers/"


cfb:
  # `group` draws a hairline between runs of related pages. The Yahoo college
  # fantasy league's pages moved to the Fantasy section (cfb_fantasy below);
  # what is left here is the real sport.
  - title: Home
    short: Home
    icon: "🏠"
    url: /cfb/index.html
    group: home

  - title: Predictions
    short: Predict
    icon: "🔮"
    url: /cfb/predictions/
    group: model

  - title: Rankings
    short: Rankings
    icon: "📈"
    url: /cfb/power/
    group: model

  - title: Schedule & Scores
    short: Schedule
    icon: "🏈"
    url: /cfb/schedule/
    group: reference


nfl:
  - title: Predictions
    short: Predict
    icon: "🔮"
    url: /nfl/index.html


# The Yahoo college fantasy league, shown under Fantasy > CFB.
cfb_fantasy:
  - title: League Home
    short: Home
    icon: "🏠"
    key: home
    url: /cfb/league/

  - title: Matchups
    short: Matchups
    icon: "⚔️"
    key: matchups
    url: /cfb/matchups/

  - title: My Team
    short: My Team
    icon: "📋"
    key: myteam
    url: /cfb/roster/

  - title: Usage
    short: Usage
    icon: "📦"
    key: usage
    url: /cfb/usage/

  - title: Analytics
    short: Analytics
    icon: "📊"
    key: analytics
    url: /cfb/analytics/
    covers: "/cfb/strength/ /cfb/live/"
