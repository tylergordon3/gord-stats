<h1>NCAAM Live Scoreboard</h1>
<div id="scoreboard" data-league="{{ page.league }}">

  <div class="meta-bar">
    <button class="legend-btn" id="open-legend" aria-label="Open legend">
      ℹ️ Legend
    </button>
    <div class="sort-bar">
      <span class="sort-label">Sort:</span>

      <button class="sort-chip" data-sort="ap25">AP 25</button>
      <button class="sort-chip" data-sort="p5">P5</button>
      <button class="sort-chip" data-sort="top3">Top 3</button>
      <button id="expand-all-btn" class="sort-chip">
        Expand All
      </button>
    </div>
    <span id="poll-rate">Polling: —</span>
  </div>

  <div id="games"></div>

</div>

{% include modal.html %}

<script src="{{ '/assets/js/live.js' | relative_url }}"></script>
