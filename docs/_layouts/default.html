<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" type="text/css" media="screen"
    href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  {% seo %}
  {% include head-custom.html %}
</head>

<body>

  <!-- HEADER -->
  <div id="header_wrap" class="outer">
    <header class="inner">
      <h1 id="project_title">GordStats.com</h1>
      <div class="header-row">
        {% include nav.html %}

      </div>
      <!-- League toggle (stays top-right) -->
      <div class="league-toggle">
        <button id="league-toggle-btn" aria-label="Toggle Men/Women">
          <span class="option men">Men</span>
          <span class="option women">Women</span>
          <span class="slider"></span>
        </button>
      </div>
    </header>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main_content_wrap" class="outer">
    <section id="main_content" class="custom-inner">
      {{ content }}
    </section>
  </div>

  <!-- FOOTER  -->
  <div id="footer_wrap" class="outer">
    <footer class="inner">
      <p class="copyright">Maintained by Tyler Gordon
    </footer>
  </div>
  <script>
    /**
     * LEAGUE-AWARE NAV REWRITE
     * --------------------------------------------------
     * Converts generic nav.yml links into league-specific URLs.
     *
     * Examples:
     *   /history.html          → /men/history.html or /women/history.html
     *   predict_YYYY-MM-DD.html → /men/predict_YYYY-MM-DD.html
     *
     * Safety rules:
     *   - NEVER rewrite Home (/index.html)
     *   - NEVER rewrite links marked with .nav-home
     *   - NEVER touch external (http/https) links
     *
     * This allows nav.yml to remain league-agnostic while
     * the site stays context-aware.
     */
    (function () {
      const path = location.pathname;
      const league = path.startsWith("/women/") ? "women" : "men";

      // Explicit filename rewrites (extend as needed)
      const rewriteMap = {
        "/history.html": `/${league}/history.html`
      };

      document.querySelectorAll('.simple-nav a, .bottom-nav a').forEach(a => {
        const href = a.getAttribute('href');

        if (!href || href.startsWith('http')) return;

        // 🚫 NEVER rewrite Home (two layers of safety)
        if (a.classList.contains("nav-home")) return;
        if (href === "/index.html") return;

        // Exact filename rewrites
        if (rewriteMap[href]) {
          a.href = rewriteMap[href];
          return;
        }

        // Daily prediction pages
        if (href.startsWith("predict_")) {
          a.href = `/${league}/${href}`;
          return;
        }

        // Default: prepend league to root-relative links
        if (href.startsWith("/")) {
          a.href = `/${league}${href}`;
        }
      });
    })();
  </script>
  <script>
    /**
     * LEAGUE TOGGLE BUTTON
     * --------------------------------------------------
     * Controls the Men/Women pill-style toggle.
     *
     * Behavior:
     *   - Detects current league from URL path
     *   - Visually activates the toggle state
     *   - Clicking switches leagues but keeps the same page
     *
     * Examples:
     *   /men/rankings.html   → /women/rankings.html
     *   /women/index.html   → /men/index.html
     *
     * Fallback:
     *   - If not in /men/ or /women/, routes to /{league}/index.html
     */
    (function () {
      const path = window.location.pathname;
      const isWomen = path.startsWith("/women/");
      const league = isWomen ? "women" : "men";

      const btn = document.getElementById("league-toggle-btn");
      if (!btn) return;

      // Set initial visual state
      btn.classList.add(league);

      function swapLeague(target) {
        if (path.startsWith("/men/")) {
          return path.replace("/men/", "/" + target + "/");
        }
        if (path.startsWith("/women/")) {
          return path.replace("/women/", "/" + target + "/");
        }
        return "/" + target + "/index.html";
      }

      btn.addEventListener("click", () => {
        const target = league === "men" ? "women" : "men";
        location.href = swapLeague(target);
      });
    })();
  </script>

  <script>
    /**
     * TODAY'S SCORES ROUTING
     * --------------------------------------------------
     * Forces the "Today's Scores" nav item to point to
     * the current league's dashboard:
     *
     *   Men   → /men/index.html
     *   Women → /women/index.html
     *
     * This keeps "Home" (root index.html) and "Today"
     * as two distinct navigation concepts.
     */
    (function () {
      const path = window.location.pathname;
      const league = path.startsWith("/women/") ? "women" : "men";

      document.querySelectorAll(".today-scores-link").forEach(link => {
        link.href = `/${league}/index.html`;
      });
    })();
  </script>
</body>

</html>
