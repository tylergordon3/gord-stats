# Where things are
source              : .
destination         : ./_site
collections_dir     : .
plugins_dir         : _plugins # takes an array of strings and loads plugins in that order
layouts_dir         : _layouts
data_dir            : _data
includes_dir        : _includes
sass:
  sass_dir: _sass
collections:
  posts:
    output          : true
  
# Feeds jekyll-seo-tag: the browser tab, the search snippet and the link
# preview all come from here. Without a title/description it was emitting a
# bare page name and no summary at all.
title: GordStats
tagline: College basketball, WNBA and fantasy football
description: >-
  Machine-learning March Madness bracketology, a WNBA fantasy dashboard, and a
  five-site fantasy football ADP board. Rebuilt daily.
author: Tyler Gordon
logo: /assets/images/brand/icon-512.png

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/brand/icon-512.png

url: "https://www.gordstats.com"
baseurl: ""

# Handling Reading
safe                : false
include             : [".htaccess", "_redirects", "site.webmanifest"]
exclude             : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"]
keep_files          : [".git", ".svn"]
encoding            : "utf-8"
markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
strict_front_matter : false

# Filtering Content
show_drafts         : null
limit_posts         : 0
future              : false
unpublished         : false

# Plugins

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
remote_theme: pages-themes/slate@v0.2.0

# Conversion
markdown            : kramdown
highlighter         : rouge
lsi                 : false
excerpt_separator   : "\n\n"
incremental         : false

# Serving
detach              : false
port                : 4000
host                : 127.0.0.1
show_dir_listing    : false

# Outputting
# permalink           : date
paginate_path       : /page:num
timezone: America/New_York

quiet               : false
verbose             : false

liquid:
  error_mode        : warn
  strict_filters    : false
  strict_variables  : false

repository: tylergordon3/gord-stats

github: false