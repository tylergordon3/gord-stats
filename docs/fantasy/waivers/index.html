window.GSL = (function(){
  var KEY='gsSleeperLeague';
  var cache={};

  function saved(){
    try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; }
  }
  function once(name, url, shape){
    if(cache[name]) return cache[name];
    cache[name]=fetch(url).then(function(r){return r.ok?r.json():shape;})
      .catch(function(){return shape;});
    return cache[name];
  }
  function players(){ return once('players','/fantasy/players-index.json',{}); }
  function week(){ return once('week','/fantasy/week-projections.json',
                               {week:0,kick:{},proj:{}}); }

  function api(id, path){
    return fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id)+path)
      .then(function(r){return r.ok?r.json():null;});
  }

  /** Everything about one league: settings, rosters, and who owns what. */
  function league(id){
    return Promise.all([api(id,''), api(id,'/rosters'), api(id,'/users')])
      .then(function(o){
        var info=o[0]||{}, rosters=o[1]||[], users=o[2]||[];
        var byUser={};
        users.forEach(function(u){
          var team=(u.metadata&&u.metadata.team_name)||u.display_name||'Team';
          var mgr=u.display_name||'';
          byUser[u.user_id]=(mgr&&team.indexOf(mgr)<0)?(team+' ('+mgr+')'):team;
        });
        var names={}, held={};
        rosters.forEach(function(r){
          var key=String(r.roster_id);
          names[key]=byUser[r.owner_id]||('Roster '+key);
          (r.players||[]).forEach(function(p){ held[String(p)]=key; });
        });
        return {info:info, rosters:rosters, names:names, held:held,
                basis:basis(info), slots:info.roster_positions||[]};
      });
  }

  /** Which of Sleeper's three published bases this league is closest to. */
  function basis(info){
    var sc=(info&&info.scoring_settings)||{};
    var rec=sc.rec;
    var i = (rec>=0.75)?0 : (rec>=0.25)?1 : 2;          // ppr / half / standard
    // Anything materially off the default is flagged so the page can say the
    // numbers are close rather than exact.
    var custom = (sc.pass_td!=null && Math.abs(sc.pass_td-4)>0.01)
      || (sc.rec_td!=null && Math.abs(sc.rec_td-6)>0.01)
      || Object.keys(sc).some(function(k){return k.indexOf('bonus')===0 && sc[k];});
    return {index:i, name:['PPR','half-PPR','standard'][i], custom:!!custom};
  }

  /** {player_id: points} under one basis. */
  function points(wk, basisIndex){
    var out={};
    for(var pid in wk.proj) out[pid]=wk.proj[pid][basisIndex];
    return out;
  }
  /** {player_id: kickoff ms} from the player's team this week. */
  function kickoffs(wk){
    var out={};
    for(var pid in wk.proj){
      var t=wk.proj[pid][3], k=t&&wk.kick[t];
      if(k){ var ms=Date.parse(k); if(!isNaN(ms)) out[pid]=ms; }
    }
    return out;
  }

  return {saved:saved, players:players, week:week, league:league,
          basis:basis, points:points, kickoffs:kickoffs};
})();
</script>{% endraw %}{% raw %}<script>
(function(){
  var KEY='gsSleeperLeague';          // {id, name} of the league being shown
  var LIST='gsSleeperLeagues';        // every league this browser knows about
  var bar=document.getElementById('ml-bar');
  if(!bar) return;
  // The usage table is the thing whose ownership can be re-pointed. On the
  // matchups page there is none: the league is picked here and a different
  // script draws it, so everything below is guarded rather than assumed.
  var table=document.querySelector('table.us');
  var sel=document.getElementById('us-own');
  var owns=!!(table&&sel&&table.tBodies[0]);
  var rows=owns?Array.prototype.slice.call(table.tBodies[0].rows):[];
  // The league the page was built with, kept so "show this site's league"
  // can put everything back without a reload.
  var BUILT=rows.map(function(r){return r.dataset.own||'';});
  var builtOptions=owns?sel.innerHTML:'';

  function saved(){
    try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; }
  }
  // The leagues found for this browser, kept beside the chosen one. Without
  // this, connecting by username signed out found four leagues and then lost
  // three of them on the next page load: the list only existed in memory, and
  // /api/leagues has nothing to say to someone who is not signed in.
  function savedList(){
    try{ return JSON.parse(localStorage.getItem(LIST)||'[]')||[]; }catch(e){ return []; }
  }
  function saveList(rows){
    try{
      if(rows&&rows.length) localStorage.setItem(LIST,JSON.stringify(rows));
      else localStorage.removeItem(LIST);
    }catch(e){}
  }
  function save(v){
    try{ v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY); }
    catch(e){}
  }
  function msg(text,cls){
    var el=document.getElementById('ml-msg');
    el.textContent=text||''; el.className='ml-msg'+(cls?' '+cls:'');
  }

  function apply(held,names,label){
    if(!owns){ draw(label); return; }
    rows.forEach(function(r){
      var own=held[r.dataset.pid]||'';
      r.dataset.own=own;
      var cell=r.querySelector('td.us-own');
      if(cell) cell.innerHTML=own
        ? names[own].replace(/[&<>]/g,function(c){
            return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})
        : '<span class="us-fa">FA</span>';
    });
    // The Fantasy filter is a list of this league's teams, so it is rebuilt
    // from the same maps rather than left pointing at the old one.
    var keys=Object.keys(names).sort(function(a,b){
      return names[a].toLowerCase()<names[b].toLowerCase()?-1:1;});
    var html='<option value="">Everyone</option>'
      +'<option value="fa">Free agents</option>'
      +'<option value="held">Rostered</option><optgroup label="Teams">';
    keys.forEach(function(k){
      html+='<option value="'+k+'">'+names[k].replace(/[&<>"]/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})+'</option>';
    });
    sel.innerHTML=html+'</optgroup>';
    rows.forEach(function(r){ r.classList.remove('us-mine'); });
    sel.value='';
    sel.dispatchEvent(new Event('change'));
    draw(label);
  }

  function restore(){
    if(owns){
      rows.forEach(function(r,i){ r.dataset.own=BUILT[i]; });
      sel.innerHTML=builtOptions;
      sel.value='';
      sel.dispatchEvent(new Event('change'));
    }
    save({site:true});
    location.reload();   // the built cells are the simplest thing to put back
  }

  function load(id,quiet){
    msg(quiet?'':'Reading the league\u2026');
    return Promise.all([
      fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id)+'/rosters'),
      fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id)+'/users'),
      fetch('https://api.sleeper.app/v1/league/'+encodeURIComponent(id))
    ]).then(function(rs){
      if(!rs[0].ok||!rs[1].ok) throw new Error('not found');
      return Promise.all(rs.map(function(r){return r.ok?r.json():null;}));
    }).then(function(out){
      var rosters=out[0]||[], users=out[1]||[], league=out[2]||{};
      var byUser={};
      users.forEach(function(u){
        var team=(u.metadata&&u.metadata.team_name)||u.display_name||'Team';
        var mgr=u.display_name||'';
        byUser[u.user_id]=(mgr&&team.indexOf(mgr)<0)?(team+' ('+mgr+')'):team;
      });
      var held={}, names={};
      rosters.forEach(function(ro){
        var key=String(ro.roster_id);
        names[key]=byUser[ro.owner_id]||('Team '+key);
        (ro.players||[]).forEach(function(pid){ held[String(pid)]=key; });
      });
      if(!Object.keys(names).length) throw new Error('empty');
      var label=league.name||('League '+id);
      var first=!(saved()||{}).id;
      save({id:id, name:label});
      apply(held,names,label);
      msg('');
      // Pages that render the league from this key read it once, at load.
      if(!owns&&first) location.reload();
      return true;
    }).catch(function(){
      msg('Could not read that league. Check the id.','err');
      return false;
    });
  }

  // Leagues synced to the account, filled in once /api/leagues answers. More
  // than one is normal for anybody in two, and picking the first silently left
  // the rest unreachable.
  var SYNCED=savedList();

  function esc(v){
    return String(v==null?'':v).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }

  /** "League - Your Team": two leagues named the same thing are otherwise the
   *  same entry twice, and people do name them the same thing.
   *
   *  Not called `label`: draw() takes a parameter by that name, which shadowed
   *  this inside the one function that needs it. */
  function leagueLabel(l){
    var name=l.name||('League '+l.league_id);
    return l.team_name ? (name+' — '+l.team_name) : name;
  }

  /** Labels for a set of leagues, guaranteed to differ from one another.
   *
   *  The team name is what usually separates two leagues called the same
   *  thing, and it is there for anything synced since team names were stored.
   *  A row from before that has none, so the season and then the tail of the
   *  id are added until the entries are actually distinguishable - an option
   *  list with the same words twice is a choice nobody can make.
   */
  function labelsFor(list){
    var out=list.map(leagueLabel);
    var seen={};
    out.forEach(function(v){ seen[v]=(seen[v]||0)+1; });
    return out.map(function(v,i){
      if(seen[v]<2) return v;
      var l=list[i];
      var extra=l.season||('#'+String(l.league_id).slice(-4));
      return v+' ('+extra+')';
    }).map(function(v,i,all){
      // Still equal? Only an id can separate them.
      var again={};
      all.forEach(function(x){ again[x]=(again[x]||0)+1; });
      return again[v]<2 ? v : v+' #'+String(list[i].league_id).slice(-4);
    });
  }

  /** One entry per league, newest season first.
   *
   *  A synced league is one row per season, so a reader in four leagues with a
   *  few years of history each has a dozen rows - listing them raw would be a
   *  dozen near-identical picker entries. They group on lineage_id, which is
   *  the oldest league id in the chain and therefore stable as seasons are
   *  added. */
  function leagues(rows){
    var groups={};
    rows.forEach(function(l){
      var key=l.lineage_id||l.league_id;
      (groups[key]=groups[key]||[]).push(l);
    });
    return Object.keys(groups).map(function(k){
      var seasons=groups[k].slice().sort(function(a,b){
        return String(b.season||'').localeCompare(String(a.season||''));});
      return {current:seasons[0], seasons:seasons};
    });
  }

  function draw(label){
    if(label){
      if(SYNCED.length>1){
        var here=String((saved()||{}).id||'');
        var labels=labelsFor(SYNCED);
        bar.innerHTML='<label>League <select id="ml-pick">'
          + SYNCED.map(function(l,i){
              return '<option value="'+esc(l.league_id)+'"'
                + (String(l.league_id)===here?' selected':'') + '>'
                + esc(labels[i]) + '</option>';
            }).join('')
          + '</select></label>'
          + '<button type="button" id="ml-clear">Show this site\u2019s league</button>'
          + '<span class="ml-msg" id="ml-msg"></span>';
        document.getElementById('ml-pick').addEventListener('change',function(){
          var want=this.value;
          var chosen=SYNCED.filter(function(l){
            return String(l.league_id)===String(want);})[0];
          if(!chosen) return;
          save({id:chosen.league_id, name:leagueLabel(chosen)});
          // Pages that render from the stored key read it once, at load.
          if(owns) load(chosen.league_id); else location.reload();
        });
      } else {
        bar.innerHTML='Showing <span class="ml-who"></span> '
          +'<button type="button" id="ml-clear">Show this site\u2019s league</button>'
          +'<span class="ml-msg" id="ml-msg"></span>';
        bar.querySelector('.ml-who').textContent=label;
      }
      document.getElementById('ml-clear').addEventListener('click',restore);
      return;
    }
    // Connecting happens here rather than on a settings page: a reader who
    // wants their own league is already looking at a page that would show it.
    // One field, because a Sleeper username and a league id cannot be mistaken
    // for each other - an id is a long run of digits and a username is not.
    bar.innerHTML='<span class="ml-label">Your Sleeper username</span>'
      +'<input id="ml-id" type="text" autocapitalize="none" autocorrect="off" '
      +'spellcheck="false" placeholder="username" '
      +'aria-label="Sleeper username, or a league id">'
      +'<button type="button" id="ml-go">Connect</button>'
      +'<span class="ml-msg" id="ml-msg"></span>';
    function go(){
      var btn=document.getElementById('ml-go');
      var v=(document.getElementById('ml-id').value||'').trim();
      if(!v){ msg('Enter your Sleeper username.','err'); return; }
      btn.disabled=true;
      var done=function(){ btn.disabled=false; };
      if(/^[0-9]{6,32}$/.test(v)) load(v).then(done);       // a league id
      else connect(v).then(done);                           // a username
    }
    document.getElementById('ml-go').addEventListener('click',go);
    document.getElementById('ml-id').addEventListener('keydown',function(e){
      if(e.key==='Enter') go();
    });
  }

  /** Every league a Sleeper account is in, found from the username.
   *
   *  Resolved in the browser so it works signed out - the league is then kept
   *  in this browser like a starred team. Signing in only adds persistence,
   *  so the POST is a best-effort extra rather than the thing that makes it
   *  work.
   */
  function connect(username){
    msg('Asking Sleeper…');
    var API='https://api.sleeper.app/v1';
    return fetch(API+'/user/'+encodeURIComponent(username))
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(user){
        if(!user||!user.user_id) throw new Error('no user');
        return fetch(API+'/state/nfl').then(function(r){return r.json();})
          .then(function(st){
            return fetch(API+'/user/'+user.user_id+'/leagues/nfl/'
                         +(st&&st.season||new Date().getFullYear()))
              .then(function(r){ return r.ok?r.json():[]; });
          });
      })
      .then(function(lgs){
        if(!lgs||!lgs.length) throw new Error('no leagues');
        SYNCED=lgs.map(function(l){
          return {provider:'sleeper', league_id:String(l.league_id),
                  name:l.name, season:String(l.season||''),
                  lineage_id:String(l.league_id)};
        });
        saveList(SYNCED);
        // Persist to the account when there is one; the page does not wait on
        // it, and nothing breaks when it is not there.
        fetch('/api/leagues',{method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({provider:'sleeper', username:username})})
          // Persisting is the extra, not the feature: signed out there is
          // nowhere to put it and the local copy is already doing the work.
          .catch(function(){ /* best effort */ });
        msg('');
        draw(leagueLabel(SYNCED[0]));
        return load(SYNCED[0].league_id, true);
      })
      .catch(function(){
        msg('Sleeper has no NFL leagues for that username this season.','err');
        return false;
      });
  }

  var have=saved();
  if(have&&have.id){ draw(have.name); load(have.id,true); }
  else draw(null);

  // A league synced to the account wins over whatever this browser remembers,
  // so a second device shows the same thing without being told again.
  fetch('/api/leagues',{credentials:'same-origin'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!d.leagues) return;
      // One entry per league, not one per season.
      // The account is the better answer when there is one: it has the team
      // names and the season history this browser's own list does not.
      var fromAccount=leagues(d.leagues.filter(function(l){
        return l.provider==='sleeper';})).map(function(g){ return g.current; });
      if(fromAccount.length){ SYNCED=fromAccount; saveList(SYNCED); }
      if(!SYNCED.length) return;
      if(have&&have.site) return;          // they asked for this site's league
      // Keep showing whatever this browser already had, if the account knows
      // it; otherwise the first synced league.
      var chosen=SYNCED.filter(function(l){
        return have&&String(l.league_id)===String(have.id);})[0] || SYNCED[0];
      if(!have||String(have.id)!==String(chosen.league_id)){
        draw(leagueLabel(chosen));
        load(chosen.league_id,true);
      } else {
        draw(leagueLabel(chosen));               // redraw, now with the picker
      }
    })
    // A network failure here is expected (signed out, or no accounts on this
    // deploy) and says nothing. A TypeError is a bug in the lines above, and
    // swallowing it cost an afternoon - so it goes to the console.
    .catch(function(e){
      if(e && e.name !== 'TypeError') return;
      if(window.console) console.error('[my-league]', e);
    });
})();
</script>{% endraw %}{% raw %}<script>
(function(){
  var host=document.getElementById('wv-host');
  if(!host||!window.GSL) return;
  var have=GSL.saved();
  if(!have||!have.id||have.site){
    host.innerHTML='<p class="wv-none">Pick a league above, or '
      +'<a href="/fantasy/sync/">connect yours</a>, to see its waivers.</p>';
    return;
  }

  var API='https://api.sleeper.app/v1';
  var MAX_SEASONS=12, WEEKS=18, PAGE=40;
  var shown=PAGE, state=null;

  function get(p){
    return fetch(API+p).then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;});
  }
  function esc(v){
    return String(v==null?'':v).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
  }
  function when(ms){
    var d=new Date(ms);
    return isNaN(d)?'':d.toLocaleDateString([], {year:'numeric', month:'short', day:'numeric'});
  }

  function chain(id){
    var out=[], seen={};
    function step(lid){
      if(!lid||seen[lid]||out.length>=MAX_SEASONS) return Promise.resolve(out);
      seen[lid]=1;
      return get('/league/'+lid).then(function(d){
        if(!d||!d.league_id) return out;
        out.push(d);
        return step(d.previous_league_id);
      });
    }
    return step(id);
  }

  /** roster_id -> manager, for one season. */
  function managers(lid){
    return Promise.all([get('/league/'+lid+'/rosters'), get('/league/'+lid+'/users')])
      .then(function(o){
        var rosters=o[0]||[], users=o[1]||[], who={}, out={};
        users.forEach(function(u){
          who[u.user_id]=(u.metadata&&u.metadata.team_name)||u.display_name||'Team';
        });
        rosters.forEach(function(r){
          out[r.roster_id]=who[r.owner_id]||('Roster '+r.roster_id);
        });
        return out;
      });
  }

  function player(index, pid){
    var meta=index[String(pid)];
    if(!meta) return esc(pid);
    return esc(meta[0])+'<span class="wv-pos">'+esc(meta[1])+'</span>';
  }

  function collect(seasons, index){
    var jobs=[];
    seasons.forEach(function(s){
      for(var w=1; w<=WEEKS; w++){
        jobs.push(get('/league/'+s.league_id+'/transactions/'+w)
          .then(function(rows){ return {season:s.season, names:s.names, rows:rows||[]}; }));
      }
    });
    return Promise.all(jobs).then(function(weeks){
      var all=[];
      weeks.forEach(function(wk){
        wk.rows.forEach(function(t){
          if(!t || !t.type) return;
          all.push({
            season: wk.season, names: wk.names, type: t.type,
            status: t.status, created: t.created || 0,
            adds: t.adds || {}, drops: t.drops || {},
            rosters: t.roster_ids || [],
            bid: (t.settings && t.settings.waiver_bid) || 0,
            budget: t.waiver_budget || [],
          });
        });
      });
      all.sort(function(a,b){ return b.created-a.created; });
      return all;
    });
  }

  function howCell(t){
    if(t.type==='trade') return '<span class="wv-how">Trade</span>';
    if(t.type==='waiver'){
      return '<span class="wv-how">Waiver</span>'
        + (t.bid ? ' <span class="wv-bid">$'+t.bid+'</span>' : '');
    }
    return '<span class="wv-how">Free agent</span>';
  }

  function rowsFor(list, index){
    return list.map(function(t){
      var ins=Object.keys(t.adds).map(function(pid){
        return '<div class="wv-in">+ '+player(index,pid)
          +' <span class="wv-how">'+esc(t.names[t.adds[pid]]||'')+'</span></div>';
      }).join('');
      var outs=Object.keys(t.drops).map(function(pid){
        return '<div class="wv-out">&minus; '+player(index,pid)
          +' <span class="wv-how">'+esc(t.names[t.drops[pid]]||'')+'</span></div>';
      }).join('');
      var faab=(t.budget||[]).map(function(b){
        return '<div class="wv-how">$'+b.amount+' '+esc(t.names[b.sender]||'')
          +' &rarr; '+esc(t.names[b.receiver]||'')+'</div>';
      }).join('');
      return '<tr'+(t.status!=='complete'?' class="wv-failed"':'')+'>'
        +'<td class="wv-when">'+when(t.created)
          // The date already carries a year. The season is only worth saying
          // when the two differ - a playoff move in January belongs to the
          // season before it.
          +(String(new Date(t.created).getFullYear())!==String(t.season)
            ? '<div class="wv-how">'+esc(t.season)+' season</div>' : '')
          +'</td>'
        +'<td>'+howCell(t)+(t.status!=='complete'
            ? '<div class="wv-how">'+esc(t.status)+'</div>' : '')+'</td>'
        +'<td>'+(ins||'<span class="wv-how">&mdash;</span>')+'</td>'
        +'<td>'+(outs||'<span class="wv-how">&mdash;</span>')+faab+'</td></tr>';
    }).join('');
  }

  function summary(all){
    var by={};
    all.forEach(function(t){
      if(t.status!=='complete') return;
      t.rosters.forEach(function(rid){
        var name=t.names[rid];
        if(!name) return;
        var a=by[name]=by[name]||{claims:0, faab:0, adds:0, drops:0, trades:0};
        if(t.type==='trade') a.trades+=1;
        else if(t.type==='waiver'){ a.claims+=1; a.faab+=t.bid||0; }
        else a.adds+=1;
      });
      Object.keys(t.drops).forEach(function(pid){
        var name=t.names[t.drops[pid]];
        if(by[name]) by[name].drops+=1;
      });
    });
    var rows=Object.keys(by).sort(function(a,b){
      return (by[b].claims+by[b].adds)-(by[a].claims+by[a].adds);});
    if(!rows.length) return '';
    var faabUsed=rows.some(function(n){ return by[n].faab>0; });
    return '<h2>Who works the wire</h2><table class="wv-t"><thead><tr><th>Manager</th>'
      +'<th>Claims</th>'+(faabUsed?'<th>FAAB</th>':'')
      +'<th>Free agents</th><th>Drops</th><th>Trades</th></tr></thead><tbody>'
      + rows.map(function(n){
          var a=by[n];
          return '<tr><td>'+esc(n)+'</td><td class="n">'+a.claims+'</td>'
            +(faabUsed?'<td class="n">$'+a.faab+'</td>':'')
            +'<td class="n">'+a.adds+'</td><td class="n">'+a.drops+'</td>'
            +'<td class="n">'+a.trades+'</td></tr>';
        }).join('')
      +'</tbody></table>';
  }

  function draw(){
    var seasonPick=document.getElementById('wv-season');
    var typePick=document.getElementById('wv-type');
    var season=seasonPick?seasonPick.value:'';
    var kind=typePick?typePick.value:'';
    var list=state.all.filter(function(t){
      if(season && t.season!==season) return false;
      if(kind==='failed') return t.status!=='complete';
      if(kind && t.type!==kind) return false;
      if(!kind && t.status!=='complete') return false;   // failed only when asked for
      return true;
    });
    var slot=document.getElementById('wv-log');
    slot.innerHTML='<table class="wv-t"><thead><tr><th>When</th><th>How</th>'
      +'<th>In</th><th>Out</th></tr></thead><tbody>'
      + (list.length ? rowsFor(list.slice(0, shown), state.index)
         : '<tr><td colspan="4"><span class="wv-none">Nothing here.</span></td></tr>')
      +'</tbody></table>'
      + (list.length>shown
         ? '<button class="wv-more" id="wv-more">Show more ('
           +(list.length-shown)+' left)</button>' : '');
    var more=document.getElementById('wv-more');
    if(more) more.addEventListener('click',function(){ shown+=PAGE; draw(); });
  }

  host.innerHTML='<p class="wv-load">Reading '+esc(have.name||'your league')+'\u2026</p>';
  chain(have.id)
    .then(function(lgs){
      if(!lgs.length) throw new Error('none');
      return Promise.all(lgs.map(function(lg){
        return managers(lg.league_id).then(function(names){
          return {league_id:lg.league_id, season:lg.season, name:lg.name, names:names};
        });
      }));
    })
    .then(function(seasons){
      return Promise.all([seasons, collect(seasons, null), GSL.players()]);
    })
    .then(function(o){
      var seasons=o[0], all=o[1], index=o[2]||{};
      state={all:all, index:index, seasons:seasons};
      var complete=all.filter(function(t){return t.status==='complete';}).length;
      host.innerHTML=
        '<p class="wv-note"><strong>'+esc(seasons[0].name||'This league')+'</strong> &middot; '
        +complete+' completed move'+(complete===1?'':'s')+' across '+seasons.length
        +' season'+(seasons.length===1?'':'s')+'. A failed claim is somebody being '
        +'outbid, so they are kept - pick <em>Failed claims</em> to see them.</p>'
        + summary(all)
        + '<h2>Every move</h2>'
        + '<div class="wv-bar"><label>Season <select id="wv-season">'
        + '<option value="">All</option>'
        + seasons.map(function(s){
            return '<option value="'+esc(s.season)+'">'+esc(s.season)+'</option>';
          }).join('')
        + '</select></label><label>Kind <select id="wv-type">'
        + '<option value="">Completed</option><option value="waiver">Waivers</option>'
        + '<option value="free_agent">Free agents</option>'
        + '<option value="trade">Trades</option>'
        + '<option value="failed">Failed claims</option>'
        + '</select></label></div><div id="wv-log"></div>';
      ['wv-season','wv-type'].forEach(function(id){
        document.getElementById(id).addEventListener('change',function(){
          shown=PAGE; draw();});
      });
      draw();
    })
    .catch(function(){
      host.innerHTML='<p class="wv-none">Could not read that league from Sleeper.</p>';
    });
})();
</script>{% endraw %}
