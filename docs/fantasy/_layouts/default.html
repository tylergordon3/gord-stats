<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" type="text/css" media="screen"
    href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  {% seo %}
  {% include head-custom.html %}
</head>

<body>

  <!-- HEADER -->
  <header id="site-header">
    <div class="site-header-inner">
      <a class="site-brand nav-home" href="{{ '/index.html' | relative_url }}">Gord<span>Stats</span>&nbsp;FF</a>
      {% include nav.html %}
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="main_content_wrap" class="outer">
    <section id="main_content" class="custom-inner">
      {{ content }}
    </section>
  </main>

  <!-- FOOTER  -->
  <footer id="site-footer">
    <p>GordStats Fantasy — <a href="https://sleeper.com/leagues/1257466498994143232">Zelk Team Fantasy Football League</a></p>
  </footer>
</body>

</html>
