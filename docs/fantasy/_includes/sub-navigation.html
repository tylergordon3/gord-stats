{% if page.subnav_id %}
  {% assign nav_items = site.data.subnavs[page.subnav_id] %}
  {% if nav_items %}
    <nav class="sub-nav">
      <ul>
        {% for item in nav_items %}
          <li {% if page.url contains item.url %}class="active"{% endif %}>
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  {% endif %}
{% endif %}
