name: cbb-env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel

  # --- Core scientific stack ---
  - numpy=2.3.*
  - pandas=2.3.*
  - scipy=1.16.*
  - scikit-learn=1.7.*
  - seaborn=0.13.*
  - matplotlib=3.10.*
  - plotly=6.2.*
  - sympy
  - mpmath

  # --- PyTorch (CPU only) ---
  - pytorch=2.5.*
  - cpuonly

  # --- Jupyter environment ---
  - jupyterlab
  - ipykernel
  - nbconvert
  - nbdime

  # --- Utilities ---
  - tqdm
  - psutil
  - requests
  - joblib
  - packaging
  - PyYAML
  - colorama
  - pillow

  # --- Pip-only packages ---
  - pip:
      - jupyterlab_git==0.51.2
      - notebook_shim==0.2.4
      - jupyter-server-mathjax==0.2.6
      - prometheus_client==0.22.1
      - kagglehub==0.3.13
