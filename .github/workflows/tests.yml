# Runs the test suite on every push. The Pi is the only other place it runs,
# and the Pi finds out at 17:30 - after the site has already failed to build.
#
# Installs the Pi's own requirements file rather than a trimmed list, so an
# install that would break the Pi's next deploy breaks here first.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pi.txt
            requirements-dev.txt
      - run: pip install -r requirements-pi.txt -r requirements-dev.txt
      - run: pip install -e .
      - run: pytest
